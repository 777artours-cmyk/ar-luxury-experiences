<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow: hidden;
    position: relative;
    background: #080C14;
  }

  .bg-image {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background-image: url('{{IMAGE_URL}}');
    background-size: cover;
    background-position: center;
    z-index: 1;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      180deg,
      rgba(8, 12, 20, 0.3) 0%,
      rgba(8, 12, 20, 0.1) 30%,
      rgba(8, 12, 20, 0.15) 50%,
      rgba(8, 12, 20, 0.7) 75%,
      rgba(8, 12, 20, 0.95) 100%
    );
    z-index: 2;
  }

  .content {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 50px;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo-container {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #D4AF37, #F0D060);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 900;
    color: #080C14;
  }

  .logo-text {
    font-size: 22px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: 0.02em;
  }

  .logo-subtext {
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .category-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(212, 175, 55, 0.2);
    border: 1px solid rgba(212, 175, 55, 0.4);
    border-radius: 50px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #D4AF37;
  }

  .bottom-content {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .title {
    font-size: 52px;
    font-weight: 900;
    color: #FFFFFF;
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-shadow: 0 4px 30px rgba(0,0,0,0.5);
    max-width: 900px;
  }

  .divider {
    width: 80px;
    height: 4px;
    background: linear-gradient(90deg, #D4AF37, #F0D060);
    border-radius: 2px;
  }

  .subtitle {
    font-family: 'Outfit', sans-serif;
    font-size: 20px;
    color: rgba(255,255,255,0.75);
    line-height: 1.6;
    max-width: 750px;
  }

  .contact-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 20px 0;
    border-top: 1px solid rgba(212, 175, 55, 0.25);
    margin-top: 10px;
  }

  .contact-item {
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.08em;
  }

  .contact-item strong {
    color: #D4AF37;
    font-weight: 600;
  }

  .swipe-indicator {
    position: absolute;
    right: 50px;
    bottom: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 4;
  }

  .swipe-arrow {
    font-size: 28px;
    color: rgba(212, 175, 55, 0.6);
  }

  .swipe-text {
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    writing-mode: vertical-rl;
  }
</style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="top-bar">
      <div class="logo-container">
        <div class="logo-icon">AR</div>
        <div>
          <div class="logo-text">AR Tours</div>
          <div class="logo-subtext">Luxury Experiences</div>
        </div>
      </div>
      <div class="category-badge">{{CATEGORY}}</div>
    </div>
    <div class="bottom-content">
      <div class="title">{{TITLE}}</div>
      <div class="divider"></div>
      <div class="subtitle">{{EXCERPT}}</div>
      <div class="contact-bar">
        <div class="contact-item"><strong>P</strong> 0400 044 004</div>
        <div class="contact-item"><strong>W</strong> www.theartours.com</div>
        <div class="contact-item"><strong>E</strong> tours@theartours.com</div>
      </div>
    </div>
  </div>
  <div class="swipe-indicator">
    <div class="swipe-arrow">&#8594;</div>
    <div class="swipe-text">Swipe for facts</div>
  </div>
</body>
</html>
